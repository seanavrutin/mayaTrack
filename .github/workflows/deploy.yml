name: Deploy to GitHub Pages

on:
  push:
    branches: [firebase]
  workflow_dispatch:

permissions:
  contents: write

# Shared with deploy-preview.yml — both jobs push to gh-pages, so they must
# never run at the same time. Queue rather than cancel: a skipped production
# deploy would leave the live site stale.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish to gh-pages root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: "Deploy ${{ github.sha }}"
        run: .github/scripts/publish-pages.sh

      - name: Summary
        run: echo "🚀 https://${{ github.repository_owner }}.github.io/mayaTrack/" >> "$GITHUB_STEP_SUMMARY"
